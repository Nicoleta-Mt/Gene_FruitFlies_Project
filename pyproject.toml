[project]
name = "gene-fruitflies-project"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.5",
    "pandas>=3.1.1",
    "pyarrow>=26.0.1",
    "pymysql>=1.2.4",
    "sqlalchemy>=2.1.9",
]

[dependency-groups]
dev = [
    "ruff>=0.17.6",
]

[tool.ruff]
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["B905"]
